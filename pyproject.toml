[project]
name = "hungarian-tokenizer-study"
version = "0.1.0"
description = "Small project to test how different transformers treat agglutanitive languages"
readme = "README.md"
authors = [
    { name = "jonahksmith", email = "jonahksmith@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.2.0",
    "jupyter>=1.1.1",
    "pyyaml>=6.0.4",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.2.0",
]

[tool.uv.build-backend]
module-name = "hutok"
